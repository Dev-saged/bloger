<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>استوديو المقالات</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.16 0.02 250);--bg2:oklch(0.2 0.025 250);--card:oklch(0.23 0.028 250);--line:oklch(0.34 0.03 250);
  --tx:oklch(0.96 0.01 250);--mut:oklch(0.74 0.03 250);--gold:oklch(0.84 0.15 88);--gold2:oklch(0.7 0.16 62);
  --ok:oklch(0.78 0.16 155);--bad:oklch(0.7 0.2 25);--warn:oklch(0.82 0.15 75);--live:#ff3b30;
  --r:20px;--ease:cubic-bezier(.22,1,.36,1);
  --f:"Readex Pro","Noto Kufi Arabic",system-ui,sans-serif;--fd:"Noto Kufi Arabic","Readex Pro",sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.6}
body{overflow:hidden}
.num,input,.mono{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.bgfx i:nth-child(1){width:340px;height:340px;background:oklch(0.5 0.12 150/.5);top:-80px;right:-60px;animation:fl1 18s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:300px;height:300px;background:oklch(0.55 0.14 80/.35);bottom:80px;left:-90px;animation:fl2 22s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(-60px,120px) scale(1.2)}}@keyframes fl2{to{transform:translate(110px,-90px) scale(.85)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:720px;margin:auto}
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 24px;scroll-behavior:smooth}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--gold),var(--gold2));display:grid;place-items:center;box-shadow:0 8px 24px oklch(0.7 0.16 62/.35)}
.top h1{font-family:var(--fd);font-weight:900;font-size:20px;line-height:1.2}
.top p{color:var(--mut);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-inline-start:auto}
.live b{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px #ff3b3033;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff3b3000}}
.card{background:linear-gradient(170deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;animation:in .5s var(--ease) both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h2{font-family:var(--fd);font-size:17px;font-weight:700;margin-bottom:12px}
label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-weight:500;cursor:pointer;transition:.2s var(--ease)}
.chip[aria-pressed=true]{background:oklch(0.84 0.15 88/.14);border-color:var(--gold);color:var(--gold)}
.chip:active{transform:scale(.96)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:16px;border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;transition:.25s var(--ease)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:0 2px 10px #0006}
input,textarea,select{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;direction:ltr;text-align:left}
textarea{direction:rtl;text-align:right;min-height:110px;resize:vertical}
input.rtl{direction:rtl;text-align:right}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{min-height:54px;width:100%;border:0;border-radius:16px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1405;box-shadow:0 10px 28px oklch(0.7 0.16 62/.3)}
.btn.sec{min-height:46px;background:transparent;border:1px solid var(--line);color:var(--tx);font-size:15px;font-weight:500}
.btn.txt{min-height:44px;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;transition:--p .5s}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:20px}
.run{display:flex;gap:16px;align-items:center}.run h2{margin:0 0 4px;font-size:16px}.run p{color:var(--mut);font-size:13px}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut);display:inline-flex;gap:6px;align-items:center}
.tag.on{border-color:var(--ok);color:var(--ok)}.tag.cd{border-color:var(--warn);color:var(--warn)}.tag.err{border-color:var(--bad);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.log{margin-top:12px;max-height:190px;overflow:auto;font-size:12.5px;color:var(--mut);direction:rtl;border-top:1px dashed var(--line);padding-top:8px}
.log div{padding:2px 0}.log .e{color:var(--bad)}.log .w{color:var(--warn)}.log .o{color:var(--ok)}
.art{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--bg);cursor:pointer;transition:.2s var(--ease)}
.art:active{transform:scale(.985)}
.art .n{font-family:var(--fd);font-weight:900;color:var(--gold);font-size:18px;min-width:30px}
.art h3{font-size:15px;font-weight:600;line-height:1.5}.art p{font-size:12.5px;color:var(--mut);margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty svg{opacity:.5;margin-bottom:10px}
.prov{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--bg)}
.prov header{display:flex;align-items:center;gap:10px}.prov header strong{font-family:var(--fd);font-size:15px}
.prov .sub{font-size:12.5px;color:var(--mut);margin:6px 0 8px}
.sw{position:relative;width:52px;height:30px;flex:none;border-radius:20px;background:var(--line);border:0;cursor:pointer;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s var(--ease)}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{inset-inline-start:25px}
.mv{display:flex;gap:4px;margin-inline-start:auto}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer}
a.lnk{color:var(--gold);font-size:13px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:oklch(0.19 0.025 250/.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{min-height:56px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:14px;position:relative;transition:.2s}
nav button[aria-current=true]{color:var(--gold)}
nav button[aria-current=true]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--gold)}
.bdg{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1b1405;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sheet{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fd .25s both}
.sheet>div{width:100%;max-width:720px;max-height:92%;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .4s var(--ease) both}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet canvas{width:100%;border-radius:16px;display:block;margin-bottom:10px;aspect-ratio:1200/630}
.body{font-size:15px;line-height:1.95;margin:12px 0}.body h2{font-size:18px;margin:18px 0 6px;color:var(--gold)}.body h3{font-size:16px;margin:12px 0 4px}.body p{margin-bottom:10px}.body ul,.body ol{padding-inline-start:22px}
.body a{color:var(--gold)}
.steps li{list-style:none;display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--mut);font-size:14px}.steps li.d{color:var(--ok)}.steps li.a{color:var(--gold)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:30;font-size:14px;max-width:90%;animation:in .3s both}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td{padding:6px;border-bottom:1px solid var(--line);direction:rtl}.ok{color:var(--ok)}.no{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* يعيد {text,provider,model}. validate(text) يرمي عند رد غير صالح فينتقل المحرك للتالي */
async function chat(messages,o={}){
  const tried=new Set();let lastErr='';
  for(let round=0;round<3;round++){
    const act=S.prov.filter(provReady);
    if(!act.length)throw new Error('لا يوجد مزود مفعّل. أضف مفتاحاً أو فعّل Pollinations');
    let progressed=false;
    for(const p of act){
      if(isCd('p|'+p.id))continue;
      let models;try{models=await listModels(p,o.sig)}catch(e){if(o.sig?.aborted)throw e;models=[]}
      models=models.map((m,i)=>[m,i]).sort((a,b)=>mScore(hk(p.id,b[0]))-mScore(hk(p.id,a[0]))||a[1]-b[1]).map(x=>x[0]);
      for(const m of models){
        const k=hk(p.id,m);if(isCd(k)||tried.has(k+'#'+round))continue;
        tried.add(k+'#'+round);progressed=true;
        const st=stat(p.id);st.busy=true;if(UI.tab==='home')renderProv();
        try{
          log(`${p.name} ← ${m.split('/').pop()}`);
          const text=await callOne(p,m,messages,o);
          if(o.validate)o.validate(text);
          st.ok++;st.busy=false;st.last='';reward(k);return {text,provider:p.name,model:m};
        }catch(e){
          st.busy=false;if(o.sig?.aborted)throw e;
          st.fail++;const msg=e.name==='AbortError'?'انتهت المهلة':e.message;st.last=msg;lastErr=msg;
          const s=e.status;
          if(s===401||s===403){coolDown('p|'+p.id,3600e3);log(`${p.name}: المفتاح مرفوض`,'e');break}
          else if(s===429||s===402){coolDown(k,Math.min(Math.max((e.retry||60)*1000,60e3),600e3));log(`${p.name}: الحد مستهلك، التالي`,'w')}
          else if(s===404||s===400||s===413){coolDown(k,3600e3);penal(k);log(`${p.name}/${m.split('/').pop()}: ${s}`,'w')}
          else if(s>=500){coolDown(k,120e3);log(`${p.name}: خطأ خادم ${s}`,'w')}
          else if(e instanceof TypeError){coolDown('p|'+p.id,300e3);log(`${p.name}: تعذّر الاتصال`,'e');break}
          else{coolDown(k,e.empty?900e3:120e3);penal(k);log(`${p.name}: ${clamp(msg,60)}`,'w')}
        }
      }
    }
    if(!progressed){
      const fut=[];S.prov.filter(provReady).forEach(p=>{[R.cd['p|'+p.id],...(R.models[p.id]?.v||[]).map(m=>R.cd[hk(p.id,m)])].forEach(x=>{if(x>now())fut.push(x)})});
      const w=fut.length?Math.min(...fut):Infinity;
      const ms=isFinite(w)?Math.min(Math.max(w-now(),3000),90000):20000;
      log(`كل المزودين في استراحة، انتظار ${Math.round(ms/1000)} ثانية`,'w');
      if(o.noWait)break;await sleep(ms,o.sig);
    }
  }
  throw new Error('فشل كل المزودين: '+clamp(lastErr,80));
}

async function fetchNews(sig){

  await Promise.all(LEAGUES.map(async lg=>{try{

function parsePlan(txt,news,n){
  const seen=new Set(),L=[];
  for(const raw of String(txt).replace(/<think>[\s\S]*?<\/think>/gi,'').split('\n')){
    const line=raw.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim();if(!line.includes('|'))continue;
    const [topic,angle,labels,ref]=line.split('|').map(x=>x.trim());
    if(!topic||topic.length<6)continue;
    const ri=/^\d+$/.test(ref||'')?+ref:null;const r=(ri!=null&&news[ri])?news[ri]:null;
    const key=r?r.url:topic;if(seen.has(key))continue;seen.add(key);
    L.push({topic:clamp(topic,120),angle:clamp(angle,200),labels:String(labels||'').split(/[،,]/).map(x=>clamp(x,24)).filter(Boolean).slice(0,3),ref:r});
  }

}

async function doExport(manual){

    step('بناء XML');const xml=buildXml(list,base);
